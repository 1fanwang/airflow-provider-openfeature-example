# Enriched hosted demo: real Airflow 3.3.0 + our provider + a REAL Flipt backend and its admin UI.
# A visitor flips the flag / adjusts the rollout in the Flipt UI and watches tasks move between pools
# in the real Airflow UI (/). Flipt evaluates over OFREP (HTTP per call, fork-safe), so unlike a
# threaded client it can also back the live A/B experiment's PythonOperators. flagd stays as the
# no-UI reference backend.
#
# On the VM, set OF_IMAGE=<acr>/of-demo:next, SITE_ADDRESS=<fqdn>, BASE_URL=https://<fqdn>,
# FLIPT_ADDRESS=<flipt-hostname>, and the ADMIN_PASSWORD / SECRET_KEY secrets.

x-airflow: &airflow
  image: ${OF_IMAGE:-of-openfeature-hosted:next}
  build:
    context: .
    dockerfile: hosted/Dockerfile
  environment: &airflow-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=
    AIRFLOW__API__SECRET_KEY: ${SECRET_KEY:-devsecret-change-me}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${SECRET_KEY:-devsecret-change-me}
    AIRFLOW__API__BASE_URL: ${BASE_URL:-http://localhost:8080}
    AIRFLOW__API__ENABLE_PROXY_FIX: "True"
    OF_BACKEND: flipt
    FLIPT_URL: http://flipt:8080
    # No-login public UI: Airflow 3.x's new UI has no anonymous FAB role, but SimpleAuthManager's
    # all-admins mode serves it without a login (fine for a rebuildable demo).
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow, POSTGRES_DB: airflow }
    healthcheck: { test: ["CMD", "pg_isready", "-U", "airflow"], interval: 5s, retries: 15 }
    restart: always

  flipt:
    image: docker.flipt.io/flipt/flipt:latest
    # Seed the declarative flags, then serve. Flipt evaluates over OFREP (plain HTTP per call, no
    # background threads), so a forked Airflow 3.x PythonOperator can read it without deadlocking --
    # which is why this demo drives both the canary ramp AND the live A/B experiment through Flipt.
    entrypoint: ["sh", "-c", "/flipt import /flipt.yaml; exec /flipt"]
    environment:
      FLIPT_LOG_LEVEL: warn
      FLIPT_META_TELEMETRY_ENABLED: "false"
      FLIPT_AUTHENTICATION_REQUIRED: "false"
    volumes:
      - ./hosted/flipt.yaml:/flipt.yaml:ro
    restart: always

  flagd:
    image: ghcr.io/open-feature/flagd:latest
    command: ["start", "--uri", "file:/flags/flags.json", "--port", "8013"]
    volumes:
      - ./flags:/flags:ro
    restart: always

  airflow-init:
    <<: *airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow fab-db migrate || true
        airflow users create -r Admin  -u admin  -p "${ADMIN_PASSWORD:-admin}" -e admin@example.com  -f Admin  -l User || true
        airflow users create -r Viewer -u viewer -p viewer                     -e viewer@example.com -f View   -l Only || true
        airflow pools set canary_pool 128 "Canary pool for the flag-driven demo" || true
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    restart: always
    depends_on:
      airflow-init: { condition: service_completed_successfully }
      flipt: { condition: service_started }

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    restart: always
    depends_on:
      airflow-init: { condition: service_completed_successfully }
      flipt: { condition: service_started }

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    restart: always
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  activity:
    <<: *airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        sleep 75
        while true; do
          airflow dags trigger platform_pool_canary  2>/dev/null || true
          sleep 180
        done
    restart: always
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  caddy:
    image: caddy:2
    restart: always
    ports: ["${HTTP_PORT:-80}:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      FLIPT_ADDRESS: ${FLIPT_ADDRESS:-flipt.localhost}
    volumes:
      - ./hosted/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./hosted/landing:/srv/landing:ro
      - caddy_data:/data
    depends_on:
      airflow-apiserver: { condition: service_started }
      flipt: { condition: service_started }

volumes:
  caddy_data:
