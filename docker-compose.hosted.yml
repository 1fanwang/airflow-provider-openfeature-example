# Enriched hosted demo: real Airflow 3.3.0 + our provider + a REAL Unleash backend and its admin UI.
# A visitor flips the flag / adjusts the rollout in the Unleash UI (/unleash) and watches tasks move
# between pools in the real Airflow UI (/). flagd is kept as the no-UI reference backend.
#
# On the VM, set OF_IMAGE=<acr>/of-demo:next, SITE_ADDRESS=<fqdn>, BASE_URL=https://<fqdn>, and the
# ADMIN_PASSWORD / SECRET_KEY / UNLEASH_ADMIN_PASSWORD secrets.

x-airflow: &airflow
  image: ${OF_IMAGE:-of-openfeature-hosted:next}
  build:
    context: .
    dockerfile: hosted/Dockerfile
  environment: &airflow-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=
    AIRFLOW__API__SECRET_KEY: ${SECRET_KEY:-devsecret-change-me}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${SECRET_KEY:-devsecret-change-me}
    AIRFLOW__API__BASE_URL: ${BASE_URL:-http://localhost:8080}
    AIRFLOW__API__ENABLE_PROXY_FIX: "True"
    OF_BACKEND: unleash
    UNLEASH_URL: http://unleash:4242/unleash/api
    UNLEASH_TOKEN: "default:development.unleash-insecure-api-token"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow, POSTGRES_DB: airflow }
    healthcheck: { test: ["CMD", "pg_isready", "-U", "airflow"], interval: 5s, retries: 15 }
    restart: always

  unleash-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: unleash, POSTGRES_PASSWORD: unleash, POSTGRES_DB: unleash }
    healthcheck: { test: ["CMD", "pg_isready", "-U", "unleash"], interval: 5s, retries: 15 }
    restart: always

  unleash:
    image: unleashorg/unleash-server:latest
    environment:
      DATABASE_URL: postgres://unleash:unleash@unleash-db/unleash
      DATABASE_SSL: "false"
      BASE_URI_PATH: "/unleash"
      INIT_ADMIN_API_TOKENS: "*:*.unleash-insecure-admin-api-token"
      INIT_CLIENT_API_TOKENS: "default:development.unleash-insecure-api-token"
      INIT_ADMIN_USERNAME: admin
      INIT_ADMIN_PASSWORD: ${UNLEASH_ADMIN_PASSWORD:-unleash4all}
    depends_on:
      unleash-db:
        condition: service_healthy
    restart: always

  unleash-setup:
    image: curlimages/curl:latest
    volumes:
      - ./hosted/setup_unleash.sh:/setup.sh:ro
    entrypoint: ["sh", "/setup.sh"]
    depends_on:
      unleash:
        condition: service_started
    restart: "no"

  flagd:
    image: ghcr.io/open-feature/flagd:latest
    command: ["start", "--uri", "file:/flags/flags.json", "--port", "8013"]
    volumes:
      - ./flags:/flags:ro
    restart: always

  airflow-init:
    <<: *airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow fab-db migrate || true
        airflow users create -r Admin  -u admin  -p "${ADMIN_PASSWORD:-admin}" -e admin@example.com  -f Admin  -l User || true
        airflow users create -r Viewer -u viewer -p viewer                     -e viewer@example.com -f View   -l Only || true
        airflow pools set canary_pool 128 "Canary pool for the flag-driven demo" || true
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    restart: always
    depends_on:
      airflow-init: { condition: service_completed_successfully }
      unleash: { condition: service_started }

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    restart: always
    depends_on:
      airflow-init: { condition: service_completed_successfully }
      unleash: { condition: service_started }

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    restart: always
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  activity:
    <<: *airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        sleep 75
        while true; do
          airflow dags trigger platform_pool_canary  2>/dev/null || true
          airflow dags trigger author_ab_experiment  2>/dev/null || true
          sleep 180
        done
    restart: always
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  caddy:
    image: caddy:2
    restart: always
    ports: ["${HTTP_PORT:-80}:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./hosted/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      airflow-apiserver: { condition: service_started }
      unleash: { condition: service_started }

volumes:
  caddy_data:
